<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>&#8203;</title>
<style>
:root{--gold:#ffd98a;--ink:rgba(6,20,32,.58)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#06121f;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#dock{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 10px;
  padding:9px 14px;border-radius:26px;background:var(--ink);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid rgba(255,214,130,.28);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,235,190,.15);max-width:calc(100vw - 20px);z-index:5}
.grp{display:flex;align-items:center;gap:4px}
.sep{width:1px;height:26px;background:linear-gradient(transparent,rgba(255,214,130,.35),transparent)}
button.ic{width:42px;height:42px;border-radius:50%;border:1px solid transparent;background:transparent;color:var(--gold);display:grid;place-items:center;cursor:pointer;padding:0;position:relative;transition:background .2s,border-color .2s,transform .15s}
button.ic:hover{background:rgba(255,214,130,.12)}
button.ic:active{transform:scale(.92)}
button.ic.on{background:rgba(255,214,130,.2);border-color:rgba(255,214,130,.55);box-shadow:0 0 14px rgba(255,200,100,.3)}
button.ic svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dots{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
.dots i{width:4px;height:4px;border-radius:50%;background:rgba(255,214,130,.3)}
.dots i.a{background:var(--gold);box-shadow:0 0 5px var(--gold)}
#tod{-webkit-appearance:none;appearance:none;width:200px;height:12px;border-radius:7px;outline:none;margin:0 6px;cursor:pointer;
 background:linear-gradient(90deg,#050a1c 0%,#1b2552 17%,#7a4a78 22%,#ff8a50 25%,#9bd6ee 33%,#66bde6 50%,#9bd6ee 62%,#ffb347 72%,#ff7a4a 75%,#3a3a7a 80%,#0a1230 90%,#050a1c 100%);
 box-shadow:inset 0 0 0 1px rgba(255,235,190,.3),0 2px 8px rgba(0,0,0,.3)}
#tod::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d8,#ffc65a 60%,#e08a1c);border:1px solid rgba(255,240,200,.8);box-shadow:0 0 12px rgba(255,190,80,.7)}
#tod::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d8,#ffc65a 60%,#e08a1c);border:1px solid rgba(255,240,200,.8);box-shadow:0 0 12px rgba(255,190,80,.7)}
@media (max-width:640px){#dock{padding:7px 8px;gap:4px 6px;border-radius:22px}button.ic{width:38px;height:38px}#tod{width:min(62vw,260px);order:9;flex-basis:100%;margin:2px 14px 4px}.sep{display:none}}
#fade{position:fixed;inset:0;background:#06121f;pointer-events:none;opacity:1;transition:opacity 1.6s ease;z-index:9}
#bar{position:fixed;top:0;left:0;right:0;height:16px;background:#000000;color:#e9d9b0;z-index:20;display:flex;align-items:center;justify-content:center;gap:14px;font:600 10px/16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;white-space:nowrap;overflow:hidden;user-select:none;pointer-events:none}#bar b{color:#f2b84b;font-weight:700}
</style>
</head>

    <button class="ic" data-view="deck" aria-label="deck"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.4"/><circle cx="12" cy="12" r="1.5"/><path d="M12 2.5v5M12 16.5v5M2.5 12h5M16.5 12h5M5.3 5.3l3.5 3.5M15.2 15.2l3.5 3.5M18.7 5.3l-3.5 3.5M8.8 15.2l-3.5 3.5"/></svg></button>
    <button class="ic" data-view="cabin" aria-label="cabin"><svg viewBox="0 0 24 24"><path d="M5.5 21V10.5a6.5 6.5 0 0 1 13 0V21z"/><path d="M12 4v17M5.5 12.5h13"/><path d="M3 21h18"/></svg></button>
  </div>
  <div class="sep"></div>
  <div class="grp" id="presets">
    <button class="ic" data-tod="0.45" aria-label="daylight"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/></svg></button>
    <button class="ic on" data-tod="0.718" aria-label="golden sunset"><svg viewBox="0 0 24 24"><path d="M2.5 17.5h19"/><path d="M7 17.5a5 5 0 0 1 10 0"/><path d="M12 7.5v2.5M5 10.5l1.8 1.8M19 10.5l-1.8 1.8M2.5 15h1.8M19.7 15h1.8"/><path d="M7 20.8h10"/></svg></button>
    <button class="ic" data-tod="0.86" aria-label="moonlit night"><svg viewBox="0 0 24 24"><path d="M19.5 14.5A8.2 8.2 0 0 1 9.5 4.5a8.2 8.2 0 1 0 10 10z"/><path d="M17 3.5v3M15.5 5h3"/></svg></button>
  </div>
  <input id="tod" type="range" min="0" max="1" step="0.001" value="0.718" aria-label="time of day">
  <div class="sep"></div>
  <div class="grp">
    <button class="ic" id="wind" aria-label="wind"><svg viewBox="0 0 24 24"><path d="M3 8.5h10.5a3 3 0 1 0-3-3"/><path d="M3 12.5h15a3 3 0 1 1-3 3"/><path d="M3 16.5h7a2.5 2.5 0 1 1-2.5 2.5"/></svg><span class="dots"><i></i><i></i><i></i></span></button>
  </div>
</div>
