<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auric Voyage</title>
<style>
  :root{--gold:#f1c463;--gold2:#ffe2a1;--ink:rgba(10,18,26,.58);--line:rgba(255,226,161,.26)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05080d;overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column}
  #bar{flex:0 0 auto;height:22px;background:#000000;color:#d9d9d9;display:flex;align-items:center;justify-content:center;gap:18px;
    font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;white-space:nowrap;padding:0 10px;user-select:none}
  #bar b{color:#8a8a8a;font-weight:500;margin-right:6px;text-transform:uppercase;letter-spacing:.12em;font-size:10px}
  #bar code{font:inherit;color:#f1c463}
  #bar i{width:3px;height:3px;border-radius:50%;background:#444;display:block}
  #stage{position:relative;flex:1 1 auto;min-height:0;background:#05080d}
  #view{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;opacity:0;transition:opacity 1.4s ease}
  #view:active{cursor:grabbing}
  body.ready #view{opacity:1}
  #dock{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:6px;
    padding:7px 9px;border-radius:999px;background:var(--ink);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
    box-shadow:0 10px 34px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,240,200,.14);max-width:calc(100% - 20px)}
  #dock button{appearance:none;border:0;background:transparent;color:var(--gold);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    transition:background .25s,color .25s,transform .2s,box-shadow .25s;flex:0 0 auto;padding:0}
  #dock button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  #dock button:hover{background:rgba(255,226,161,.13);color:var(--gold2)}
  #dock button:active{transform:scale(.93)}
  #dock button:focus-visible,#tod:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
  #dock button[aria-pressed="true"]{background:linear-gradient(180deg,#f7d98a,#d79b34);color:#22160a;box-shadow:0 0 18px rgba(255,196,96,.45)}
  .sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:0 0 auto}
  #tod{appearance:none;-webkit-appearance:none;width:clamp(110px,22vw,250px);height:40px;background:transparent;margin:0 6px;cursor:pointer;flex:1 1 auto;min-width:90px}
  #tod::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,#0a1230 0%,#1a2a5c 18%,#f08d55 25%,#8fd0f2 34%,#6fc0f0 62%,#ffc96a 72%,#f0744a 76%,#1a2a5c 84%,#0a1230 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
  #tod::-moz-range-track{height:6px;border-radius:6px;background:linear-gradient(90deg,#0a1230 0%,#1a2a5c 18%,#f08d55 25%,#8fd0f2 34%,#6fc0f0 62%,#ffc96a 72%,#f0744a 76%,#1a2a5c 84%,#0a1230 100%)}
  #tod::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;margin-top:-6px;background:radial-gradient(circle at 35% 30%,#fff3cf,#e9b048 60%,#a86a16);border:1px solid rgba(40,24,6,.6);box-shadow:0 0 12px rgba(255,200,110,.7)}
  #tod::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3cf,#e9b048 60%,#a86a16);border:1px solid rgba(40,24,6,.6);box-shadow:0 0 12px rgba(255,200,110,.7)}
  @media (max-width:640px){
    #dock{flex-wrap:wrap;justify-content:center;border-radius:26px;gap:2px 4px;padding:6px 8px;width:min(340px,calc(100% - 16px))}
    #tod{order:9;flex:1 1 100%;width:100%;margin:0 8px;height:30px}
    .sep{margin:0 1px}
    #dock button{width:38px;height:38px}
  }
  @media (max-height:420px){#dock button{width:34px;height:34px}#dock{padding:4px 7px;bottom:6px}}
  @media (prefers-reduced-motion:reduce){#view{transition:none}}
</style>
</head>
<body>
<div id="bar"><span><b>Model</b><code>claude-fable-5-2</code></span><i></i><span><b>Time</b><code>1h 27m</code></span></div>
<div id="stage">
  <div id="dock" role="toolbar" aria-label="Scene controls">
    <button type="button" data-hour="12" aria-label="Daylight" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></button>
    <button type="button" data-hour="17.62" aria-label="Golden sunset" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M6.5 16a5.5 5.5 0 0 1 11 0"/><path d="M2.5 16h19M5.5 19.5h13M12 4.5v3M4.6 8.6l2 2M19.4 8.6l-2 2"/></svg></button>
    <button type="button" data-hour="22.2" aria-label="Moonlit night" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M19.5 14.2A8 8 0 0 1 9.8 4.5a8 8 0 1 0 9.7 9.7z"/><path d="M17 4.2l.5 1.3 1.3.5-1.3.5-.5 1.3-.5-1.3-1.3-.5 1.3-.5z"/></svg></button>
    <input id="tod" type="range" min="0" max="24" step="0.01" value="17.62" aria-label="Time of day">
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-view="exterior" aria-label="Exterior view" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 16.5h18l-2.2 3.8H6z"/><path d="M12 3v11.5M12 4.5c3.2 1.6 5.2 4.6 5.8 8.5H12M10.5 6.5C8.6 8.3 7.4 10.500 7 13h3.500"/></svg></button>
    <button type="button" data-view="deck" aria-label="Deck view" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.7"/><path d="M12 2.5v7.800M12 13.700v7.800M2.500 12h7.800M13.700 12h7.800M5.300 5.300l5.500 5.500M13.200 13.200l5.500 5.500M5.300 18.700l5.500-5.500M13.200 10.800l5.500-5.500"/></svg></button>
    <button type="button" data-view="cabin" aria-label="Captain's cabin view" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5.500 20.500V11a6.500 6.500 0 0 1 13 0v9.500z"/><path d="M12 4.500v16M5.500 13h13M3.500 20.500h17"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" id="wind" aria-label="Fill the sails" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 8.500h10.500a2.800 2.800 0 1 0-2.800-2.800"/><path d="M3 12.500h15.500a2.800 2.800 0 1 1-2.800 2.800"/><path d="M3 16.500h7.500a2.300 2.300 0 1 1-2.300 2.300"/></svg></button>
  </div>
</div>
